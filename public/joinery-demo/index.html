<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Motor Paramétrico</title>
  <style>
    :root { --bg:#eef1f4; --panel:#fff; --text:#161b22; --muted:#6b7280; --accent:#b3261e; --border:#d6dde6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
    .layout { display: grid; grid-template-columns: 360px 1fr; min-height: 100vh; }
    .sidebar, .viewer { padding: 24px; }
    .sidebar { background: var(--panel); border-right: 1px solid var(--border); }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
    select, textarea, button { width: 100%; font: inherit; }
    select, textarea { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: #fff; }
    textarea { min-height: 320px; resize: vertical; margin-top: 12px; }
    button { margin-top: 12px; border: none; border-radius: 10px; padding: 12px 16px; background: var(--accent); color: #fff; cursor: pointer; }
    .viewer-card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 20px; min-height: calc(100vh - 48px); }
    .viewer-card svg { width: 100%; height: auto; display: block; }
    .meta { margin-top: 12px; color: var(--muted); font-size: 14px; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .sidebar { border-right: none; border-bottom: 1px solid var(--border); } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Motor Paramétrico</h1>
      <p>Edite o JSON ou escolha um exemplo para visualizar o SVG gerado pelo engine.</p>
      <select id="sample-select"></select>
      <textarea id="json-input"></textarea>
      <button id="render-btn">Renderizar SVG</button>
      <div class="meta" id="status-msg"></div>
    </aside>
    <main class="viewer">
      <div class="viewer-card" id="svg-mount"></div>
    </main>
  </div>
  <script type="module">
    import { renderJoinery, sampleConfigs } from '../joinery-engine/index.js';
    const sampleSelect = document.querySelector('#sample-select');
    const jsonInput = document.querySelector('#json-input');
    const renderBtn = document.querySelector('#render-btn');
    const svgMount = document.querySelector('#svg-mount');
    const statusMsg = document.querySelector('#status-msg');
    const entries = Object.entries(sampleConfigs);
    sampleSelect.innerHTML = entries.map(([key]) => `<option value="${key}">${key}</option>`).join('');
    function loadSample(key) { jsonInput.value = JSON.stringify(sampleConfigs[key], null, 2); }
    function renderCurrent() {
      try {
        const config = JSON.parse(jsonInput.value);
        svgMount.innerHTML = renderJoinery(config);
        statusMsg.textContent = 'SVG gerado com sucesso.';
      } catch (error) {
        statusMsg.textContent = error instanceof Error ? error.message : 'Erro ao renderizar.';
      }
    }
    sampleSelect.addEventListener('change', () => { loadSample(sampleSelect.value); renderCurrent(); });
    renderBtn.addEventListener('click', renderCurrent);
    loadSample(entries[0][0]);
    renderCurrent();
  </script>
</body>
</html>
